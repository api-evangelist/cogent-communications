description: >-
  Cogent Communications Holdings, Inc. (NASDAQ: CCOI, AS174) is a facilities-based Tier 1
  internet service provider headquartered in Washington, DC, selling Dedicated Internet Access,
  IP Transit, Ethernet, MPLS IP-VPN, SD-WAN, optical wavelength transport, Global Peer Connect
  peering ports and colocation across its own global fiber network. Cogent publishes no public
  API, developer portal or machine-readable contract: a full probe on 2026-09-14 found no
  OpenAPI, AsyncAPI, GraphQL, MCP server or agent card on any host it operates, and the
  api.cogentco.com and developer.cogentco.com names a prior scaffold recorded do not exist in
  DNS. Its programmatic-adjacent surfaces are two login-gated portals — eCogent for billing,
  orders, tickets, DNS changes and IP/BGP requests, and the Global Peer Exchange portal for
  peering ports. What it does publish openly is a dated Network Services SLA with quantified
  latency, jitter and packet-delivery commitments, plus monthly network performance statistics.
