note: >-
  Cogent publishes no API, so there is no API versioning scheme, no deprecation policy and no
  API status page to record. What Cogent does publish, and what is captured here, is the
  Network Services Service Level Agreement for its transport products, plus a monthly-updated
  public network performance page. Both are service-level commitments on the network, NOT on a
  programmable interface — read them that way.
