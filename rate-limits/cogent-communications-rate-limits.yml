# 2026-09-14: the previous version of this file carried one placeholder limit row
# ("see vendor documentation (gated)") written by the 2026-05-04 bulk sweep. Cogent
# publishes no API at all, so there is no rate limit to record and the placeholder has
# been removed rather than left to read as a measured limit. An honest zero is the data.
method: searched
source: https://www.cogentco.com/en/products-and-services
reconciled: true
tags:
  - Rate Limiting
  - Internet
  - Network
description: >-
  Cogent Communications publishes no public API and therefore publishes no API rate limits.
  A full probe on 2026-09-14 of www.cogentco.com, cogentco.com, ecogent.cogentco.com and
  globalpeerexchange.com found no OpenAPI, no developer portal and no API reference of any
  kind; api.cogentco.com and developer.cogentco.com do not resolve in DNS. Cogent's
  quantitative service commitments are network-level (latency, jitter, packet delivery,
  availability credits) and live in the Network Services SLA, not in a per-key API quota.
